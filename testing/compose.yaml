# Lokale Testserver unter Windows (Docker Desktop):  docker compose -f testing/compose.yaml up -d --build
# In Cloud-Sitzungen stattdessen:                     bash testing/testenv.sh start
#
# Ports auf deinem PC:
#   SSH  127.0.0.1:2222  tester / tester
#   RDP  127.0.0.1:3390  tester / tester   (3390 statt 3389, damit es nicht mit dem
#                                           Windows-eigenen Remotedesktop kollidiert)
services:
  sshd:
    build: ./sshd
    ports:
      - "127.0.0.1:2222:22"
  xrdp:
    build: ./xrdp
    ports:
      - "127.0.0.1:3390:3389"
